    unbind MWHEELDOWN; bind "MWHEELDOWN" "invnext"
    unbind q; bind scancode20 "lastinv"
    unbind g; bind scancode10 "drop"
    unbind e; bind scancode8 "+lookatweapon"
    unbind h; bind scancode11 "switchhands"
    unbind b; bind scancode5 "buymenu"
    unbind 1; bind scancode30 "slot1"
    unbind 2; bind scancode31 "slot2"
    unbind 3; bind scancode32 "slot3"
    unbind 4; bind scancode33 "slot4"
    unbind 5; bind scancode34 "slot5"
    unbind 6; bind scancode35 "slot6"
    unbind 7; bind scancode36 "slot7"
    unbind 8; bind scancode37 "slot8"
    unbind 9; bind scancode38 "slot9"
    unbind 0; bind scancode39 "slot10"
    unbind x; bind scancode27 "slot12"

//# UI Keys
    unbind TAB; bind scancode43 "+showscores"
    unbind -; bind scancode45 "toggleconsole" // ß (DE)
    unbind DEL; bind scancode76 "sellbackall"

//# Communication Options
    unbind MOUSE3; bind "MOUSE3" "player_ping"
