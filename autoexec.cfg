    cl_debounce_zoom "true"
    sensitivity "1.67"
    zoom_sensitivity_ratio "1"

//# Movement Keys
    unbind i; bind scancode12 "show_loadout_toggle"
    unbind w; bind scancode26 "+forward"
    unbind s; bind scancode22 "+back"
    unbind a; bind scancode4 "+left"
    unbind d; bind scancode7 "+right"
    unbind SHIFT; bind scancode225 "+sprint"
    unbind CTRL; bind scancode224 "+duck"
    unbind SPACE; bind scancode44 "+jump"

//# Weapon Keys
    unbind f; bind scancode9 "+use"
    unbind MOUSE1; bind "MOUSE1" "+attack"
    unbind MOUSE2; bind "MOUSE2" "+attack2" //# zoom / aim
    unbind r; bind scancode21 "+reload"
