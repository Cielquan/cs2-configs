//###################

//# Game
    mm_dedicated_search_maxping "25"
    cl_net_buffer_ticks "0"

//# Hud
    hud_scaling "1.0"
    cl_hud_color "0"
    cl_force_spec_hud_color_to_team "true"

//# Team
    //# Show Team ID Through Walls - 3 = All
    cl_teamid_overhead_mode "3"
    //# Show Player Colors in Competitive - 1 = Show colors
    cl_teammate_colors_show "1"
    //# Use Player Colors on Team ID
    cl_teamid_overhead_colors_show "true"

//# Communication
    cl_player_ping_mute "0"

//# Spectator / Scoreboard
    cl_scoreboard_mouse_enable_binding +attack2

//# Item
    cl_silencer_mode 0

    //# Viewmodel
    //# Preset - Options: 1|2
    viewmodel_presetpos "1"
    //# FOV - Range: 54-68
    viewmodel_fov "54"
    //# Gun left/right or mid/outside - Range: -2 - +2.5
    viewmodel_offset_x "0"
    //# Gun Close/Far - Range: -2 - +2
    viewmodel_offset_y "-2"
    //# Gun Bottom/Top - Range: -2 - +2
    viewmodel_offset_z "-2"

    cl_prefer_lefthanded "true"
    r_drawtracers_firstperson "true"
    cl_use_opens_buy_menu "false"
    cl_buywheel_donate_key "0"

//# Radar / Tablet
    cl_radar_always_centered "true"
    cl_radar_rotate "true"
    cl_hud_radar_map_additive "true"
    cl_hud_radar_blur_background "true"
    cl_hud_radar_background_alpha "0.75"
